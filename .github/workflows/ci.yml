name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate the knowledge base
        run: asv kb
      - name: Offline test suite
        run: pytest tests -q

  pipeline:
    # Full pipeline on the real corpus. Runs on demand; uses the offline mock
    # backend unless GEMINI_API_KEY is set as a repository secret.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Build corpus
        run: asv corpus
      - name: Slice
        run: asv slice
      - name: Check label anchors
        run: python scripts/check_labels.py
      - name: Detect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then P=gemini; else P=mock; fi
          asv detect --provider $P --limit 200
      - name: Baseline, evaluate, prevent
        run: |
          asv baseline --kind static
          asv evaluate
          asv prevent
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
