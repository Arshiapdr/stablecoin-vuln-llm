    license: GPL-3.0
    paths:
      - "contracts/**/*.sol"
    mechanism: rebase
    family: rebase              # report: rebasing algorithm
    market:
      # peg_target `none`: AMPL targets the 2019 CPI-adjusted dollar and
      # defends it by rebasing balances, not by holding price at $1.00. A $0.99
      # threshold would measure the mechanism working as designed.
      peg_target: none
      llama_coin: coingecko:ampleforth
      llama_start: 1609459200
      llama_span: 200
    incident: null

  - name: yam-finance
    display: YAM Finance v1 (YAM)
    tier: study
    algorithmic: pure
    language: solidity
    repo: https://github.com/yam-finance/yam-protocol
    ref: master
    license: unspecified   # no LICENSE file exists anywhere in this repo's
                           # history; recorded honestly rather than assumed
    paths:
      - "contracts/token/*.sol"
      - "contracts/rebaser/*.sol"
    mechanism: rebase
    family: rebase              # report: rebasing algorithm
    # No pinning needed: unlike Beanstalk, this repository was never patched.
    # The project migrated to YAM v2/v3 in separate repositories and abandoned
    # this one on 2020-08-25, so master still carries the deployed defect —
    # verified at contracts/token/YAM.sol:340.
    # No market series exists for YAM v1 in any free source: the Binance
    # archive has no YAMUSDT, DefiLlama returns nothing under coingecko:yam,
    # :yam-2, :yam-v3 or the verified v1 contract address, and the failure
    # was a governance freeze rather than a depeg, so a price threshold
    # could not detect it even with data.
    market: null
    incident:
      date: "2020-08-13"
      summary: "A single missing .div(BASE) in rebase() inflated totalSupply on the first positive rebase, minting far more YAM to the reserve than intended and permanently locking governance quorum ~35 hours after launch"
      loss_usd: 750000
      source: "https://peckshield.medium.com/yam-incident-root-cause-analysis-f3fb2213af53"

  # Beanstalk is carried TWICE, as a vulnerable/patched pair. Same protocol,
  # same codebase, differing in the governance facet that was exploited. This
  # is the project's only controlled A/B: the detector should flag V5 in the
  # pinned pre-attack tree and NOT flag it in the post-remediation tree.
  - name: beanstalk
    display: Beanstalk (BEAN) — pre-attack
    tier: study
    algorithmic: pure
    language: solidity
    repo: https://github.com/BeanstalkFarms/Beanstalk
    # PINNED to 2022-04-11, six days before the governance attack. This is a
    # commit SHA, not a branch: corpus.clone() resolves it exactly and fails
    # loudly rather than falling back to master, because master is patched and
    # the V5 label below would otherwise point at code that no longer exists.
    ref: e9f49910e287e7a7afaa6db8f536b7194728b0af
    license: MIT
    paths:
      - "protocol/contracts/**/*.sol"
    mechanism: credit_based_seigniorage
    family: seigniorage_shares  # report: seigniorage-shares algorithm (credit variant)
    market:
      peg_target: usd
      llama_coin: coingecko:bean
      llama_start: 1650067200
      llama_span: 200
    incident:
      date: "2022-04-17"
      summary: "Flash-loan governance capture via emergencyCommit"
      loss_usd: 181000000
      source: "https://medium.com/immunefi/hack-analysis-beanstalk-governance-attack-april-2022-f42788fc821e"

  - name: beanstalk-patched
    display: Beanstalk (BEAN) — post-remediation
    tier: control
    algorithmic: pure
    language: solidity
    repo: https://github.com/BeanstalkFarms/Beanstalk
    ref: master
    license: MIT
    paths:
      - "protocol/contracts/**/*.sol"
    mechanism: credit_based_seigniorage
    family: seigniorage_shares
    # The patched half of the vulnerable/patched pair: emergencyCommit was
    # removed after 17 Apr 2022, so a V5 hit here is a false positive by
    # construction. `algorithmic: pure` because the DESIGN is unchanged — only
    # its role differs, which is exactly why the two axes are separate.
    market:
      # Same token as the pinned tree; the window is the post-replant period
      # (16 Aug 2022), not the attack.
      peg_target: usd
      llama_coin: coingecko:bean
      llama_start: 1660678200
      llama_span: 200
    incident: null

