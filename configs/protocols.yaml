# Corpus definition.
#
# THREE INDEPENDENT AXES. They were previously collapsed into one `tier` field,
# which conflated "is this design algorithmic?" with "did its peg fail?" — and
# produced two indefensible rows: Fei (fully collateral-backed, its algorithmic
# mechanism retired in 2021) sat in the algorithmic study set because it had a
# famous incident, while Reflexer RAI (a PID controller continuously adjusting
# the redemption rate — genuinely an algorithmic peg mechanism) sat in the
# controls because its peg held.
#
# 1. `algorithmic:` — a property of the MECHANISM, independent of outcome.
#      pure    = uncollateralised; the peg is defended by supply changes alone
#      partial = partially collateralised, with an algorithmic ratio/fee
#                controller and an endogenous share token absorbing redemptions
#      none    = the peg is defended by exogenous collateral
#
# 2. `tier:` — the protocol's ROLE in the evaluation, nothing more.
#      study   = in scope for the headline result
#      control = expected negative; measures the false-positive rate
#
# 3. `family:` — the mechanism descriptor used by knowledge/vulnerabilities.yaml
#    `applies_to`. Note that V1-V3 are structurally impossible without an
#    absorbing token, so a rebase design cannot exhibit them.
#
# Report the results in three layers: `algorithmic: pure` is the report's true
# scope, `pure + partial` is the extended set, and the controls give the
# false-positive rate. Do not quote a single blended number.
#
# `paths` are repository-relative globs restricted to the stabilisation logic;
# vendored libraries, tests and mocks are excluded by the collector.
#
# Every entry is a public repository under a permissive licence. Nothing here
# is scraped from a block explorer, so the corpus is reproducible with git alone.
#
# Candidates considered and deliberately NOT included, for reproducibility:
#   - Djed (Cardano/COTI): no public repository contains the on-chain Plutus
#     validators. COTI's 2024 "open source" release covers only the order API,
#     chain indexer and frontend (github.com/artifi-labs/open-djed); the
#     protocol contracts themselves are not published. Cannot be gathered by
#     git alone, so it is excluded rather than reconstructed from third-hand
#     sources.
#   - USDD (Tron): no dedicated, canonical open-source contract repository
#     could be located (only the generic tronprotocol/java-tron node code).
#   - Float Protocol: the org's public repos (float-staking, float-ui, ...)
#     do not include the core bank/vault contracts; the protocol appears to
#     be defunct and the core repo unreachable under any plausible name.

protocols:

  - name: terra-classic
