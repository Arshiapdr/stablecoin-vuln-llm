  - name: fei-protocol
    display: Fei Protocol (FEI)
    tier: control
    algorithmic: none
    language: solidity
    repo: https://github.com/fei-protocol/fei-protocol-core
    ref: develop
    license: AGPL-3.0
    paths:
      - "contracts/**/*.sol"
    mechanism: direct_incentives_pcv
    family: pcv_backed
    # A CONTROL, not part of the algorithmic study set. FEI is fully backed by
    # exogenous collateral (Protocol Controlled Value), and the "direct
    # incentives" mechanism that was genuinely algorithmic was abandoned in
    # 2021. Note also that the incident below is a reentrancy bug in the Rari
    # /Fuse pools — a DIFFERENT repository, and evidence about a code defect
    # rather than about PCV-backing as a monetary mechanism. It earns its place
    # by measuring false positives: V1/V2 firing on a collateral-backed
    # protocol is a real error worth counting.
    #
    # Checked against the code rather than assumed, since DefiLlama classifies
    # FEI as pegMechanism "algorithmic". The shipped mechanism is redemption
    # against exogenous collateral: contracts/peg/ holds PegStabilityModule,
    # FixedPricePSM, PriceBoundPSM, NonCustodialPSM and SimpleFeiDaiPSM. The
    # direct-incentive HOOK does survive in contracts/fei/Fei.sol — the
    # `incentiveContract` mapping and `_checkAndApplyIncentives()` fire on every
    # transfer — but the only UniswapIncentive implementation in the collected
    # tree is contracts/mock/MockUniswapIncentive.sol, and the sole non-mock
    # setter is the governor-only setIncentiveContract in Fei.sol itself. Hook
    # without implementation, so `none` stands.
    market:
      peg_target: usd
      llama_coin: coingecko:fei-usd
      llama_start: 1651190400
      llama_span: 200
      stablecoin_id: 9
    incident:
      date: "2022-04-30"
      summary: "Reentrancy in Rari/Fuse pools"
      loss_usd: 80000000
      source: "https://halborn.com/explained-the-fei-protocol-hack-april-2022/"

