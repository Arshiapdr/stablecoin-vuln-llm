      - "x/treasury/**/*.go"
      - "x/oracle/**/*.go"
    mechanism: dual_token_seigniorage
    family: dual_token          # report: dual-token mechanism
    market:
      peg_target: usd
      binance_symbol: USTUSDT
      binance_months: ["2022-04", "2022-05"]
      llama_coin: coingecko:terrausd
      llama_start: 1651363200
      llama_span: 400
      stablecoin_id: 3
    incident:
      date: "2022-05-09"
      summary: "UST depegged and collapsed; LUNA supply expanded ~5900x"
      loss_usd: 40000000000
      source: "https://www.nber.org/papers/w31160"

