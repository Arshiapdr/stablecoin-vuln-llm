  - name: mento
    display: Mento (cUSD, renamed USDm)
    tier: control
    # CORRECTED from `none`. This was classified by reputation ("reserve-backed,
    # therefore collateral-backed") rather than by reading the code, and the
    # code says otherwise on three counts:
    #
    #   1. Stable tokens are MINTED and BURNED, not paid from inventory.
    #      contracts/swap/Broker.sol, transferOut():
    #        if (reserve.isStableAsset(token)) IERC20(token).safeMint(to, amount);
    #      and symmetrically safeBurn() in transferIn(). Supply therefore
    #      expands and contracts as a function of swap flow — a supply-based
    #      stabilisation mechanism, not mere collateral redemption.
    #
    #   2. Price comes from an oracle-anchored virtual AMM.
    #      contracts/swap/BiPoolManager.sol, getUpdatedBuckets():
    #        bucket0 = exchange.config.stablePoolResetSize;
    #        bucket1 = rateDenominator * bucket0 / rateNumerator;
    #      Virtual buckets are periodically re-anchored to an oracle rate and
    #      then traded along ConstantProduct/ConstantSumPricingModule. That is
    #      the "algorithmic ratio/fee controller" of the `partial` definition.
    #
    #   3. An on-chain circuit breaker gates every swap:
    #      breakerBox.getRateFeedTradingMode(...) == TRADING_MODE_BIDIRECTIONAL.
    #
    # Reserve.sol does hold real exogenous collateral with per-asset daily
    # spending limits and a tobin tax below a target reserve ratio — hence
    # `partial`, not `pure`. DefiLlama independently classifies it
    # pegMechanism: "algorithmic" (stablecoins.llama.fi/stablecoin/24).
    #
    # Honest caveat on the second half of the `partial` definition ("endogenous
    # share token absorbing redemptions"): Mento's reserve held CELO, the
    # native token of the same chain, alongside BTC/ETH/DAI. The endogeneity is
    # ecosystem-level, not a dedicated share token like TITAN or FXS. The
    # algorithmic-controller criterion is met outright; this one only partly.
    #
    # No metric moves: `tier: control` takes precedence in by_layer(), so Mento
    # stays in the control bucket. What changes is Figure 2 and Table 2, which
    # previously labelled it "collateral-backed" — a claim Broker.sol refutes.
    algorithmic: partial
    language: solidity
    repo: https://github.com/mento-protocol/mento-core
    ref: develop
    license: unspecified
    paths:
      - "contracts/**/*.sol"
    mechanism: reserve_backed_amm
    family: reserve_amm
    market:
      peg_target: usd
      llama_coin: coingecko:celo-dollar
      llama_start: 1652054400
      llama_span: 200
      stablecoin_id: 24
    incident: null

