  - name: reflexer-rai
    display: Reflexer RAI
    tier: control
    algorithmic: partial
    language: solidity
    repo: https://github.com/reflexer-labs/geb
    ref: master
    license: AGPL-3.0
    paths:
      - "src/**/*.sol"
    mechanism: pid_controlled_cdp
    family: cdp
    # `algorithmic: partial` on purpose. RAI's PID controller continuously
    # adjusts the redemption rate, which IS an algorithmic peg mechanism — it
    # is more algorithmic than Fei. It is a control because it is
    # overcollateralised and its peg held, and that combination is itself a
    # finding: what breaks these designs is the absorbing token, not the
    # algorithm.
    market:
      # peg_target `none`: RAI has no fixed peg. Its redemption price floats
      # under PID control and sat near $3.02 in the observation window, so
      # deviation from $1.00 is undefined for it.
      peg_target: none
      llama_coin: coingecko:rai
      llama_start: 1652054400
      llama_span: 200
    incident: null

